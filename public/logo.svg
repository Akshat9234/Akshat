<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cq-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322" />
      <stop offset="50%" stop-color="#070A12" />
      <stop offset="100%" stop-color="#05070D" />
    </linearGradient>

    <!-- Path / Flow Gradient: Electric Blue -> Vivid Indigo -> Violet -->
    <linearGradient id="cq-path" x1="100%" y1="80%" x2="0%" y2="20%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="45%" stop-color="#06B6D4" />
      <stop offset="85%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Spark Glow Filter -->
    <filter id="cq-spark-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="cq-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#cq-bg)" stroke="url(#cq-border)" stroke-width="1.8" />

  <!-- Upward Career Progression Path (Subtle 'C' curve from lower-right curving left, up, and to top destination) -->
  <path
    d="M 68 76 C 42 76, 25 64, 25 49 C 25 34, 42 24, 68 24"
    stroke="url(#cq-path)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Subtle upward progression arrow tick in the middle spine -->
  <path
    d="M 25 50 L 22 45 M 25 50 L 28 45"
    stroke="#22D3EE"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Milestone Nodes along the Career Path (Dream -> Journey -> Skills -> Destination) -->
  <!-- Node 1: Entry / Origin (Bottom Right) -->
  <circle cx="68" cy="76" r="4.5" fill="#0B0F19" stroke="#3B82F6" stroke-width="2.5" />
  <circle cx="68" cy="76" r="2" fill="#60A5FA" />

  <!-- Node 2: Foundations (Lower Curve) -->
  <circle cx="37" cy="67" r="4" fill="#0B0F19" stroke="#06B6D4" stroke-width="2.2" />
  <circle cx="37" cy="67" r="1.8" fill="#22D3EE" />

  <!-- Node 3: Core Skills (Mid Curve Spine) -->
  <circle cx="25" cy="49" r="4.5" fill="#0B0F19" stroke="#38BDF8" stroke-width="2.5" />
  <circle cx="25" cy="49" r="2.2" fill="#FFFFFF" />

  <!-- Node 4: Advanced Capstone (Upper Curve) -->
  <circle cx="37" cy="31" r="4" fill="#0B0F19" stroke="#8B5CF6" stroke-width="2.2" />
  <circle cx="37" cy="31" r="1.8" fill="#A855F7" />

  <!-- Node 5: Career Destination (Top Right Target) -->
  <circle cx="68" cy="24" r="5" fill="#0B0F19" stroke="#C084FC" stroke-width="2.5" />
  <circle cx="68" cy="24" r="2.5" fill="#F472B6" />

  <!-- AI Spark / Star at Destination Point (Guidance & Achievement) -->
  <g transform="translate(77, 16)" filter="url(#cq-spark-glow)">
    <!-- 4-point AI Spark -->
    <path
      d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z"
      fill="#FFFFFF"
    />
    <circle cx="0" cy="0" r="1.5" fill="#38BDF8" />
  </g>
  <!-- Secondary micro-spark -->
  <circle cx="83" cy="24" r="1.2" fill="#38BDF8" opacity="0.8" />
</svg>
